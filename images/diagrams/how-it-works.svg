<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="560" fill="#0E1626"/>
  <text x="600" y="52" fill="#FFFFFF" font-size="28" font-weight="700" text-anchor="middle">Three layers of checks, one engine, everywhere you write Pine</text>
  <text x="600" y="84" fill="#9FB3C8" font-size="17" text-anchor="middle">Every diagnostic is proven both ways: it catches the real error and stays silent on valid code</text>

  <!-- input -->
  <rect x="40" y="200" width="170" height="130" rx="14" fill="#16233A" stroke="#3B82F6" stroke-width="2"/>
  <text x="125" y="248" fill="#FFFFFF" font-size="20" font-weight="700" text-anchor="middle">your .pine</text>
  <text x="125" y="276" fill="#9FB3C8" font-size="15" text-anchor="middle">file, as you</text>
  <text x="125" y="296" fill="#9FB3C8" font-size="15" text-anchor="middle">type</text>
  <path d="M212 265 H252" stroke="#9FB3C8" stroke-width="3" marker-end="url(#a)"/>

  <!-- layers -->
  <g>
    <rect x="258" y="120" width="560" height="100" rx="14" fill="#13294B" stroke="#3B82F6" stroke-width="2"/>
    <text x="282" y="156" fill="#60A5FA" font-size="15" font-weight="700">LAYER 1 · SIGNATURES AND NAMES</text>
    <text x="282" y="184" fill="#FFFFFF" font-size="18">475 built-in functions, every documented overload</text>
    <text x="282" y="207" fill="#9FB3C8" font-size="15">Missing or extra arguments · unknown parameters · undefined names</text>
  </g>
  <g>
    <rect x="258" y="232" width="560" height="100" rx="14" fill="#13294B" stroke="#22C55E" stroke-width="2"/>
    <text x="282" y="268" fill="#4ADE80" font-size="15" font-weight="700">LAYER 2 · WHOLE-DOCUMENT CHECKS</text>
    <text x="282" y="296" fill="#FFFFFF" font-size="18">Whole-script rules and v6 pitfalls</text>
    <text x="282" y="319" fill="#9FB3C8" font-size="15">Version header · alertcondition arity · functions removed in v6 · timenow units</text>
  </g>
  <g>
    <rect x="258" y="344" width="560" height="120" rx="14" fill="#13294B" stroke="#F59E0B" stroke-width="2"/>
    <text x="282" y="380" fill="#FBBF24" font-size="15" font-weight="700">LAYER 3 · SEMANTIC CHECKS S1–S10</text>
    <text x="282" y="408" fill="#FFFFFF" font-size="18">Code that compiles and is still wrong</text>
    <text x="282" y="431" fill="#9FB3C8" font-size="15">Repainting · ta.* in conditionals · accumulator drift · scope errors</text>
    <text x="282" y="452" fill="#9FB3C8" font-size="15">64 plots / 40 requests · entries with no exit · feeds that halt the chart</text>
  </g>
  <path d="M820 290 H860" stroke="#9FB3C8" stroke-width="3" marker-end="url(#a)"/>

  <!-- outputs -->
  <rect x="866" y="120" width="294" height="344" rx="14" fill="#16233A" stroke="#9FB3C8" stroke-width="1.5"/>
  <text x="1013" y="158" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">Same findings in</text>
  <g font-size="17" fill="#FFFFFF">
    <rect x="890" y="178" width="246" height="48" rx="10" fill="#1E3A5F"/><text x="1013" y="208" text-anchor="middle">VS Code · Marketplace</text>
    <rect x="890" y="236" width="246" height="48" rx="10" fill="#1E3A5F"/><text x="1013" y="266" text-anchor="middle">Cursor · Windsurf · VSCodium</text>
    <rect x="890" y="294" width="246" height="48" rx="10" fill="#1E3A5F"/><text x="1013" y="324" text-anchor="middle">Command line (CI)</text>
    <rect x="890" y="352" width="246" height="48" rx="10" fill="#1E3A5F"/><text x="1013" y="382" text-anchor="middle">AI agents via MCP</text>
  </g>
  <text x="1013" y="438" fill="#9FB3C8" font-size="14" text-anchor="middle">engine: pinescript-v6-validator (npm)</text>

  <text x="600" y="520" fill="#9FB3C8" font-size="15" text-anchor="middle">Semantic checks are suppressible when deliberate:  // pine-ignore: S1</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9FB3C8"/></marker></defs>
</svg>
