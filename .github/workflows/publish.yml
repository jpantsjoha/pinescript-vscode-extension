name: Publish Extension

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest

    steps:
    # Both registries or neither: check every publishing credential before
    # anything is published, so a missing token cannot leave a split release
    # (Marketplace live, Open VSX behind).
    - name: Preflight publishing credentials
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
      run: |
        missing=""
        [ -n "$VSCE_PAT" ] || missing="$missing VSCE_PAT"
        [ -n "$OVSX_PAT" ] || missing="$missing OVSX_PAT"
        if [ -n "$missing" ]; then
          echo "::error::Missing publishing secret(s):$missing. Nothing was published."
          exit 1
        fi

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Build extension
      run: npm run build

    # vsce is the pinned devDependency installed by npm ci (never a global install).
    - name: Package extension
      run: npx --no-install vsce package

    - name: Verify packaged VSIX (entries + execute activate())
      run: node scripts/verify-vsix.js "pinescript-v6-extension-${GITHUB_REF_NAME#v}.vsix"

    # Publish the one VSIX built above to both registries, so they ship identical bits.
    - name: Publish to VS Code Marketplace
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
      run: npx --no-install vsce publish -p "$VSCE_PAT" --packagePath "pinescript-v6-extension-${GITHUB_REF_NAME#v}.vsix"

    # Open VSX serves Cursor, Windsurf, VSCodium, Gitpod and Theia. Its token was
    # checked in the preflight step, before the Marketplace publish.
    - name: Publish to Open VSX
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
      run: npx --yes ovsx publish "pinescript-v6-extension-${GITHUB_REF_NAME#v}.vsix" -p "$OVSX_PAT"

    - name: Upload VSIX to release
      uses: softprops/action-gh-release@v1
      with:
        files: '*.vsix'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
